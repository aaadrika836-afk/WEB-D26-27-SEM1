<!DOCTYPE html>
<html>
<body>
    <form action="#" method="POST">
        <!-- Select element generating a dropdown menu -->
        <label for="course">Course:</label>
        <select id="course" name="course">
            <option value="ece">ECE</option>
            <option value="cse">CSE</option>
            <option value="me">ME</option>
        </select><br><br>
        
        <!-- Textarea providing a multi-line text input field -->
        <label for="feedback">Feedback:</label><br>
        <textarea id="feedback" name="feedback" rows="4" cols="30" placeholder="Write here..."></textarea><br><br>
        
        <!-- Button variations: submission, form reset, and general interaction -->
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <button type="button">Click Me</button>
    </form>
</body>
</html>
