<!DOCTYPE html>
<html>
<body>
    <form action="#" method="POST">
        <!-- Fieldset provides a border grouping related elements, legend provides the group title -->
        <fieldset>
            <legend>Personal Details</legend>
            
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"><br><br>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br><br>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"><br><br>
            
            <!-- Radio inputs forcing mutually exclusive selection -->
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>
            
            <!-- Checkbox inputs allowing multiple selections -->
            <label>Hobbies:</label>
            <input type="checkbox" id="reading" name="hobbies" value="reading">
            <label for="reading">Reading</label>
            <input type="checkbox" id="coding" name="hobbies" value="coding">
            <label for="coding">Coding</label><br><br>
            
            <label for="dob">DOB:</label>
            <input type="date" id="dob" name="dob">
        </fieldset>
    </form>
</body>
</html>
