<!DOCTYPE html>
<html>
<body>
    <!-- Table incorporating structural semantic tags -->
    <table border="1">
        <caption>Student Marks</caption>
        
        <!-- Table header grouping -->
        <thead>
            <tr>
                <th>Roll</th>
                <th>Name</th>
                <th>Marks</th>
            </tr>
        </thead>
        
        <!-- Table body grouping -->
        <tbody>
            <tr>
                <td>1</td>
                <td>Aman</td>
                <td>85</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Riya</td>
                <td>92</td>
            </tr>
        </tbody>
        
        <!-- Table footer grouping -->
        <tfoot>
            <tr>
                <!-- Colspan merges two columns in the footer -->
                <td colspan="2">Average</td>
                <td>88.5</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
