<html>
    <head>
        <title>Basic List Types</title>
    </head>
    <body>

        <!--Unordered List-->
       <h1>Unordered List</h1>
       <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
       </ul>

       <!--Ordered List-->
       <h1>Ordered</h1>
       <ol>
        <li>A. Install VS Code</li>
        <li>B. Create file</li>
        <li>C. Open in browser</li>
       </ol>

       <!--Description List-->
       <h1>Description</h1>
       <dl>
        <dt>HTML</dt>
        <dd>Hyper Text Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>
       </dl>
       
    </body>
</html>
