<html>
    <head>
        <title>Using levels of Heading, Paragraphs and Text Formatting</title>
    </head>
    <body>
        <h1>Heading 1</h1> <!--Defines the Heading of Level 1-->
        <h2>Heading 2</h2> <!--Defines the Heading of Level 2-->
        <h3>Heading 3</h3> <!--Defines the Heading of Level 3-->
        <p>Text with <b>bold,</b><i> italic,</i><u> underline,</u><mark> mark,</mark> H<sub>2</sub>O, x<sup>2</sup></p> <!--Defines the paragraph section of the Webpage with text formatting-->
        <p>&copy; &reg; &trade; &lt; tag&gt; &amp; &euro; &#8377; &hearts;</p> <!--Defines the paragraph section of the Webpage with special characters-->
    </body>
</html>
